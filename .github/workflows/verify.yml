name: Verify four-agent prototype
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s l3_system/tests -t . -v
      - name: D01 dataset manifest contract tests
        run: |
          python -m pip install -r deliverables/D01/requirements-d01.txt -r requirements-monitoring.txt
          python -m unittest discover -s deliverables/D01/tests -v
      - run: python -m experiments.check_docs
      - name: Real Atropine acceptance and paired baselines
        if: matrix.python == '3.12'
        run: |
          python -m experiments.run_validation --output outputs/validation
          python -m experiments.compare --output outputs/comparison
          python -m experiments.validate_session --output outputs/session_validation
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: smpl-validation-and-comparison
          path: outputs/
          if-no-files-found: ignore

  fusion-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-fusion.txt
      - name: Install optional CPU training dependencies
        run: |
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-learn==1.8.0
          python -m pip check
      - name: D04 encoding, masking and training checks
        run: |
          python -m unittest discover -s deliverables/D04/tests -v
          python -m l3_system.monitoring.multimodal_model --synthetic-demo --output /tmp/d04-synthetic-report.json
          python -m l3_system.monitoring.fusion_comparison --synthetic-demo --output /tmp/d04-comparison-report.json
